# Used by GitHub-generated release notes. Tags are created only after the documented release gate passes.
changelog:
  categories:
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "Accessibility and quality"
      labels:
        - "accessibility"
        - "quality"
    - title: "Documentation and maintenance"
      labels:
        - "documentation"
        - "maintenance"
  exclude:
    labels:
      - "skip-changelog"
    authors:
      - "dependabot[bot]"
