name: Public release verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify public source, provenance, and history
        env:
          ALLOW_DEPENDABOT_DCO: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
        run: |
          npm run version:check
          npm run public:boundary
          if [[ "$ALLOW_DEPENDABOT_DCO" == "true" ]]; then
            npm run policy:dco -- --allow-dependabot
          else
            npm run policy:dco
          fi
          npm run licenses:check
          npm run workflows:check
          node scripts/check-content-provenance.mjs
          node scripts/check-public-history.mjs

      - name: Validate source and deterministic checks
        run: |
          npm run check
          npm test

      - name: Build and verify generated public output
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify visible experience and accessibility
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/ifl-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/ > /dev/null && break
            sleep 1
            if [ "$attempt" = 30 ]; then cat "$RUNNER_TEMP/ifl-preview.log"; exit 1; fi
          done
          BASE_URL=http://127.0.0.1:4321 npm run qa:frontend
          BASE_URL=http://127.0.0.1:4321 npm run qa:a11y

      - name: Prove no generated source drift
        run: node scripts/check-generated-cleanliness.mjs
