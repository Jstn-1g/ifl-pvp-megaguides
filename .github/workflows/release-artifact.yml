name: Build immutable release artifact

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      PUBLIC_BUILD_SHA: ${{ github.sha }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run public release gates
        run: |
          npm audit --omit=dev --audit-level=high
          npm run version:check
          npm run public:boundary
          npm run policy:dco
          npm run licenses:check
          npm run workflows:check
          node scripts/check-content-provenance.mjs
          node scripts/check-public-history.mjs
          npm run check
          npm test
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility proof
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/ifl-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/ > /dev/null && break
            sleep 1
            if [ "$attempt" = 30 ]; then cat "$RUNNER_TEMP/ifl-preview.log"; exit 1; fi
          done
          BASE_URL=http://127.0.0.1:4321 npm run qa:frontend
          BASE_URL=http://127.0.0.1:4321 npm run qa:a11y

      - name: Write and verify immutable artifact manifest
        run: |
          node scripts/write-release-manifest.mjs "--tag=$RELEASE_TAG" "--commit=$RELEASE_COMMIT"
          node scripts/verify-release-candidate.mjs "--tag=$RELEASE_TAG" "--commit=$RELEASE_COMMIT"
          node scripts/check-generated-cleanliness.mjs

      - name: Package deterministic release archive
        shell: bash
        run: |
          artifact="ifl-pvp-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C dist . | gzip -n -9 > "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          echo "RELEASE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Upload immutable static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ifl-pvp-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/release-manifest.json
            ${{ env.RELEASE_ARTIFACT }}
            ${{ env.RELEASE_ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 90


  publish:
    name: publish durable release assets
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ifl-pvp-${{ github.ref_name }}-${{ github.sha }}

      - name: Publish durable GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ARTIFACT: ifl-pvp-${{ github.ref_name }}-${{ github.sha }}.tar.gz
        run: |
          publish_draft=false
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME" --draft)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
            publish_draft=true
          elif [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]]; then
            publish_draft=true
          fi
          existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          existing_dir="$(mktemp -d)"
          trap 'rm -rf "$existing_dir"' EXIT
          upload_assets=()
          for asset in "$RELEASE_ARTIFACT" "$RELEASE_ARTIFACT.sha256"; do
            if grep -Fxq "$asset" <<< "$existing_assets"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$existing_dir"
              if ! cmp --silent "$asset" "$existing_dir/$asset"; then
                echo "Existing release asset $asset does not match the verified local artifact." >&2
                exit 1
              fi
            else
              upload_assets+=("$asset")
            fi
          done
          if (( ${#upload_assets[@]} > 0 )); then
            gh release upload "$GITHUB_REF_NAME" "${upload_assets[@]}"
          fi
          if [[ "$publish_draft" == "true" ]]; then gh release edit "$GITHUB_REF_NAME" --draft=false; fi

      - name: Mark verified release pull request as tagged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          associated_prs="$(gh api --method GET "repos/$GH_REPO/commits/$RELEASE_COMMIT/pulls")"
          release_pr="$(jq -cer --arg version "$release_version" '
            [.[] | select(
              .merged_at != null
              and .base.ref == "main"
              and (.head.ref | startswith("release-please--"))
              and (.title | startswith("chore(main): release "))
              and (.title | endswith(" " + $version))
              and ([.labels[].name] | any(. == "autorelease: pending" or . == "autorelease: tagged"))
            )]
            | if length == 1 then .[0] else error("expected exactly one merged release PR for the tag commit") end
          ' <<< "$associated_prs")"
          release_number="$(jq -er '.number' <<< "$release_pr")"
          has_pending="$(jq -r '[.labels[].name] | index("autorelease: pending") != null' <<< "$release_pr")"
          has_tagged="$(jq -r '[.labels[].name] | index("autorelease: tagged") != null' <<< "$release_pr")"

          if [[ "$has_tagged" == "true" ]]; then
            if [[ "$has_pending" == "true" ]]; then
              gh pr edit "$release_number" --repo "$GH_REPO" --remove-label "autorelease: pending"
            fi
            exit 0
          fi
          if [[ "$has_pending" != "true" ]]; then
            echo "Release PR #$release_number has neither the pending nor tagged lifecycle label." >&2
            exit 1
          fi
          gh pr edit "$release_number" --repo "$GH_REPO" --add-label "autorelease: tagged"
          gh pr edit "$release_number" --repo "$GH_REPO" --remove-label "autorelease: pending"
